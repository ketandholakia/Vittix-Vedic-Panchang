name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run code quality checks (Tests & PHPStan)
      run: composer quality

  gate:
    needs: [build, slow-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Require every job green (PRs and tags)
      run: |
        results="${{ join(needs.*.result, ' ') }}"
        echo "job results: $results"
        for r in $results; do
          if [ "$r" != "success" ]; then
            echo "::error::Required CI job did not succeed ($r)."
            exit 1
          fi
        done

  slow-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ '8.2', '8.4' ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run the full suite including slow tests (property, oracle, boundary, year-scan)
      run: composer test:all
